<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login Page</title>
<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container">
    <!-- Left Section -->
    <div class="left">
        <h2>WELCOME BACK</h2>
        <p>Welcome back! Please enter your details.</p>

        <div class="input-group">
            <label>Email</label>
            <input type="email" placeholder="Enter your email">
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" placeholder="****">
        </div>

        <div class="options">
            <label><input type="checkbox"> Remember me</label>
            <a href="#">Forgot password</a>
        </div>

        <button class="btn">Sign in</button>

        <button class="btn google-btn">
            <img src="https://uploads.onecompiler.io/44bw74xv3/44bw75zcr/OIP.webp" width="18">
            Sign in with Google
        </button>

        <div class="signup">
            Don’t have an account? <a href="#">Sign up for free</a>
        </div>
    </div>

    <!-- Right Section -->
    <div class="right">
        <img src="https://uploads.onecompiler.io/44bw74xv3/44bw75zcr/login%20img.jpg" alt="Athlete Illustration">
    </div>
</div>

</body>
</html>
